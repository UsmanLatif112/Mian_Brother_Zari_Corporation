{% extends 'base.html' %}
{% block title %}Audit Log{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Audit Log</h1>
<table class="table datatable"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead>
<tbody>{% for l in logs %}<tr><td>{{ l.created_at }}</td><td>{{ l.user_id }}</td><td>{{ l.action }}</td><td>{{ l.entity_type }}</td><td>{{ l.details }}</td></tr>{% endfor %}</tbody></table>
{% endblock %}
