{# Shared quick-add vendor modal — used from Inventory and Sales product forms #}
{% from 'partials/macros.html' import customer_photos_field %}
<div class="modal fade erp-form-modal" id="quickVendorModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Vendor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-2 align-items-end">
          <div class="col-12">
            {{ customer_photos_field(icon='fa-truck-field', label='Vendor photos', folder='vendors') }}
          </div>
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input id="qv-name" class="form-control" placeholder="Vendor name">
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input id="qv-phone" class="form-control" placeholder="Phone">
          </div>
          <div class="col-md-6">
            <label class="form-label">CNIC <span class="text-muted fw-normal">(optional)</span></label>
            <input id="qv-cnic" class="form-control" placeholder="CNIC">
          </div>
          <div class="col-md-6">
            <label class="form-label">Opening Balance <span class="text-muted fw-normal">(optional)</span></label>
            <input type="number" step="0.01" id="qv-balance" class="form-control" placeholder="Leave blank if none">
          </div>
          <div class="col-12">
            <label class="form-label">Address</label>
            <textarea id="qv-address" class="form-control" rows="2" placeholder="Address"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Notes</label>
            <input id="qv-notes" class="form-control" placeholder="Optional">
          </div>
        </div>
        <div class="text-danger small mt-2 d-none" id="qv-error"></div>
      </div>
      <div class="modal-footer erp-modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" id="qv-save">Save Vendor</button>
      </div>
    </div>
  </div>
</div>
