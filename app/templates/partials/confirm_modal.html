{# Modern delete / confirm modal — used site-wide via .btn-delete-confirm #}
<div class="modal fade erp-confirm-modal" id="globalConfirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" id="global-confirm-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="modal-header border-0 pb-0">
          <div class="erp-confirm-icon erp-confirm-icon--danger" id="global-confirm-icon">
            <i class="fa-solid fa-trash"></i>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body pt-2">
          <h5 class="modal-title mb-1" id="global-confirm-title">Are you sure?</h5>
          <p class="text-muted small mb-0" id="global-confirm-message">This action cannot be undone easily.</p>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger px-4" id="global-confirm-submit">Delete</button>
        </div>
      </form>
    </div>
  </div>
</div>
