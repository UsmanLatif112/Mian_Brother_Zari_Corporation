{% macro form_modal(title, submit_label='Save', size='modal-lg', form_id='entity-form') %}
<div class="modal fade erp-form-modal" id="formModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered {{ size }} modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        {{ caller() }}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" form="{{ form_id }}" class="btn btn-success">{{ submit_label }}</button>
      </div>
    </div>
  </div>
</div>
{% endmacro %}
