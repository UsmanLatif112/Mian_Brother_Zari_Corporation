{# Nested unpaid dues picker — opened from Record Payment (does not close payment modal). #}
<div class="modal fade erp-form-modal" id="unpaidDuesModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="true">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title mb-0">Unpaid entries</h5>
          <div class="small text-muted" id="unpaid-dues-customer"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0">
        <div class="table-responsive">
          <table class="table table-sm align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="text-center" style="width:42px">
                  <input type="checkbox" class="form-check-input" id="unpaid-dues-select-all" title="Select all">
                </th>
                <th style="width:110px">Date</th>
                <th style="min-width:180px">Particulars</th>
                <th style="width:90px">Status</th>
                <th class="text-end" style="width:110px">Amount</th>
              </tr>
            </thead>
            <tbody id="unpaid-dues-body">
              <tr><td colspan="5" class="text-muted text-center py-3">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer justify-content-between flex-wrap gap-2">
        <div class="small">
          <div class="fw-semibold">
            Total balance he owes us:
            <span id="unpaid-dues-total" class="text-warning">0</span>
          </div>
          <div class="text-muted">
            Selected for payment:
            <span id="unpaid-dues-selected-total" class="fw-semibold text-primary">0</span>
          </div>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="btn-apply-unpaid-dues">
            Apply
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
