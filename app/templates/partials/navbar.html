<header class="erp-topbar d-flex align-items-center justify-content-between px-3">
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-sm btn-outline-secondary d-lg-none" id="sidebar-toggle"><i class="fa-solid fa-bars"></i></button>
    <form class="global-search" action="#" onsubmit="return false;">
      <div class="input-group input-group-sm">
        <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="search" class="form-control" id="global-search-input" placeholder="{{ search_placeholder }}" autocomplete="off">
      </div>
      <div class="search-results d-none" id="global-search-results"></div>
    </form>
  </div>
  <div class="d-flex align-items-center gap-3">
    <div class="dropdown">
      <button class="btn btn-sm btn-light dropdown-toggle" data-bs-toggle="dropdown" title="User menu">
        <i class="fa-solid fa-user-circle"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><span class="dropdown-item-text fw-semibold">{{ current_user.full_name }}</span></li>
        <li><span class="dropdown-item-text text-muted small">{{ current_user.role.value|title }}</span></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <button class="dropdown-item" type="button" id="theme-toggle" title="Toggle theme">
            <i class="fa-solid fa-moon me-2"></i>Dark mode
          </button>
        </li>
        <li>
          <span class="dropdown-item-text small">
            <i class="fa-solid fa-database me-2"></i>
            <span class="badge bg-success-subtle text-success border border-success-subtle" id="sync-status" title="Data syncs from Sync page when online">
              {% if offline_sqlite %}Offline · SQLite{% else %}Online DB{% endif %}
            </span>
          </span>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="{{ url_for('auth.logout') }}">Logout</a></li>
      </ul>
    </div>
  </div>
</header>
