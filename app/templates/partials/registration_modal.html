<div class="modal fade erp-confirm-modal" id="registrationModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <div class="erp-confirm-icon erp-confirm-icon--warning">
          <i class="fa-solid fa-key"></i>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body pt-2">
        <h5 class="modal-title mb-1">Register This Computer</h5>
        <p class="text-muted small mb-3">
          Enter the registration key from your administrator. Internet is required once to verify
          the key in MySQL. After that this PC is registered in SQLite and works offline.
        </p>
        <label class="form-label" for="registration-key-input">Registration Key</label>
        <input type="text" class="form-control font-monospace text-uppercase" id="registration-key-input"
               placeholder="MBZC-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
        <div class="invalid-feedback d-block small mt-2 d-none" id="registration-error"></div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success px-4" id="registration-submit-btn">
          <span class="reg-btn-label"><i class="fa-solid fa-check me-1"></i> Register</span>
          <span class="reg-btn-spinner d-none">
            <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
            Registering...
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
