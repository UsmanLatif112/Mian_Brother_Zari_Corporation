<div class="modal fade erp-form-modal" id="quickCustomerTypeModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">New customer type</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label" for="qct-name">Type name</label>
        <input type="text" id="qct-name" class="form-control" placeholder="e.g. VIP / Weekly" autocomplete="off">
        <label class="form-label mt-2" for="qct-due">Due days</label>
        <input type="number" id="qct-due" class="form-control" min="0" step="1" value="30">
        <div class="text-danger small mt-2 d-none" id="qct-error"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" id="qct-save">Save</button>
      </div>
    </div>
  </div>
</div>
