{% extends 'base.html' %}
{% block title %}Categories{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Product Categories</h1>
<div class="row g-3">
  {% for c in categories %}
  <div class="col-md-4">
    <div class="card shadow-sm border-0 h-100">
      <div class="card-body">
        <h2 class="h6">{{ c.name }}</h2>
        <ul class="small mb-0">
          {% for s in c.subcategories %}<li>{{ s.name }}</li>{% else %}<li class="text-muted">No subcategories</li>{% endfor %}
        </ul>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
