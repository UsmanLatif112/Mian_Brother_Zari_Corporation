{% extends 'base.html' %}
{% block title %}Sales Report{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Sales Report</h1>
<form class="row g-2 mb-3"><div class="col-auto"><input type="date" name="start" value="{{ start or '' }}" class="form-control"></div>
<div class="col-auto"><input type="date" name="end" value="{{ end or '' }}" class="form-control"></div>
<div class="col-auto"><button class="btn btn-success">Filter</button></div></form>
<table class="table datatable"><thead><tr><th>Invoice</th><th>Date</th><th>Total</th></tr></thead>
<tbody>{% for s in sales %}<tr><td>{{ s.invoice_no }}</td><td>{{ s.sale_date }}</td><td>{{ s.grand_total }}</td></tr>{% endfor %}</tbody></table>
{% endblock %}
