{% extends 'base.html' %}
{% block title %}Sales Report{% endblock %}
{% block page_filters %}
<div class="header-page-filter dropdown" data-header-filter>
  <button type="button"
          class="btn btn-sm btn-outline-secondary header-filter-toggle"
          data-bs-toggle="dropdown"
          data-bs-auto-close="outside"
          aria-expanded="false"
          title="Filter">
    <i class="fa-solid fa-filter"></i>
    {% if start or end %}<span class="header-filter-dot" aria-hidden="true"></span>{% endif %}
  </button>
  <div class="dropdown-menu dropdown-menu-end header-filter-menu p-0">
    <form method="get" class="header-filter-form" data-persist-filters="reports-sales">
      <label class="dash-filter-label">From</label>
      <input type="date" name="start" value="{{ start or '' }}" class="form-control form-control-sm">
      <label class="dash-filter-label">To</label>
      <input type="date" name="end" value="{{ end or '' }}" class="form-control form-control-sm">
      <button type="submit" class="btn btn-sm btn-outline-secondary header-filter-apply">Apply</button>
      {% if start or end %}
      <a href="{{ url_for('reports.sales_report') }}" class="header-filter-clear" data-clear-page-filters="reports-sales" title="Clear filter" aria-label="Clear filter">
        <i class="fa-solid fa-xmark"></i>
      </a>
      {% endif %}
    </form>
  </div>
</div>
{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Sales Report</h1>
<table class="table datatable"><thead><tr><th>Invoice</th><th>Date</th><th>Total</th></tr></thead>
<tbody>{% for s in sales %}<tr><td>{{ s.invoice_no }}</td><td>{{ s.sale_date }}</td><td>{{ s.grand_total }}</td></tr>{% endfor %}</tbody></table>
{% endblock %}
