{% if pagination and pagination.total %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 px-3 py-2 border-top bg-white">
  <span class="text-muted small">
    Showing {{ pagination.from_idx }}–{{ pagination.to_idx }} of {{ pagination.total }}
  </span>
  {% if pagination.pages > 1 %}
  <nav aria-label="List pagination">
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item {% if not pagination.has_prev %}disabled{% endif %}">
        <a class="page-link"
           href="{% if pagination.has_prev %}{{ url_for(endpoint, page=pagination.prev_page, **list_filter_args) }}{% else %}#{% endif %}"
           {% if not pagination.has_prev %}tabindex="-1" aria-disabled="true"{% endif %}>Prev</a>
      </li>
      <li class="page-item disabled">
        <span class="page-link">Page {{ pagination.page }} / {{ pagination.pages }}</span>
      </li>
      <li class="page-item {% if not pagination.has_next %}disabled{% endif %}">
        <a class="page-link"
           href="{% if pagination.has_next %}{{ url_for(endpoint, page=pagination.next_page, **list_filter_args) }}{% else %}#{% endif %}"
           {% if not pagination.has_next %}tabindex="-1" aria-disabled="true"{% endif %}>Next</a>
      </li>
    </ul>
  </nav>
  {% endif %}
</div>
{% endif %}
