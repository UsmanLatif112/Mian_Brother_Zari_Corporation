{# Modern delete confirmation — site-wide via .btn-delete-confirm #}
<div class="modal fade erp-confirm-modal" id="globalConfirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content erp-delete-confirm-card">
      <form method="post" id="global-confirm-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="modal-header border-0 pb-0">
          <div class="erp-confirm-icon erp-confirm-icon--danger" id="global-confirm-icon" aria-hidden="true">
            <i class="fa-solid fa-triangle-exclamation" id="global-confirm-icon-fa"></i>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body pt-2">
          <h5 class="modal-title mb-1" id="global-confirm-title">Delete this item?</h5>
          <p class="text-muted small mb-0" id="global-confirm-message">This cannot be undone easily.</p>
          <div class="erp-delete-effects d-none" id="global-confirm-effects-wrap">
            <p class="erp-delete-effects-label mb-2">What will change</p>
            <ul class="erp-delete-effects-list mb-0" id="global-confirm-effects"></ul>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0 erp-delete-confirm-actions">
          <button type="button" class="btn btn-outline-secondary flex-fill" data-bs-dismiss="modal" id="global-confirm-cancel">
            No
          </button>
          <button type="submit" class="btn btn-danger flex-fill" id="global-confirm-submit">
            Yes, delete
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
