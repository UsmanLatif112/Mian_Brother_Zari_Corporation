{% extends 'base.html' %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Settings</h1>
<form method="post" action="{{ url_for('settings.save') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card shadow-sm mb-3"><div class="card-body row g-3">
    <div class="col-md-6"><label class="form-label">Company Name</label><input name="company_name" class="form-control" value="{{ values.company_name }}"></div>
    <div class="col-md-6"><label class="form-label">Email</label><input name="company_email" class="form-control" value="{{ values.company_email }}"></div>
    <div class="col-md-6"><label class="form-label">Phone</label><input name="company_phone" class="form-control" value="{{ values.company_phone }}"></div>
    <div class="col-md-6"><label class="form-label">Currency</label><input name="currency" class="form-control" value="{{ values.currency }}"></div>
    <div class="col-12"><label class="form-label">Address</label><textarea name="company_address" class="form-control" rows=2>{{ values.company_address }}</textarea></div>
  </div></div>
  <button class="btn btn-success">Save Settings</button>
  <a href="{{ url_for('settings.audit') }}" class="btn btn-outline-secondary ms-2">Audit Log</a>
</form>
{% endblock %}
