{% extends 'base.html' %}
{% block title %}New Purchase{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Record Purchase</h1>
<form method="post" class="card shadow-sm border-0"><div class="card-body">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="row g-3 mb-3">
  <div class="col-md-3"><label class="form-label">Invoice #</label><input name="invoice_no" class="form-control" required></div>
  <div class="col-md-3"><label class="form-label">Date</label><input type="date" name="purchase_date" value="{{ today }}" class="form-control" required></div>
  <div class="col-md-6"><label class="form-label">Vendor</label><select name="vendor_id" class="form-select" required>{% for v in vendors %}<option value="{{ v.id }}">{{ v.name }}</option>{% endfor %}</select></div>
</div>
<table class="table" id="lines"><thead><tr><th>Product</th><th>Qty</th><th>Price</th></tr></thead>
<tbody><tr>
  <td><select name="product_id" class="form-select">{% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></td>
  <td><input name="quantity" type="number" step="0.001" class="form-control" value="1"></td>
  <td><input name="unit_price" type="number" step="0.01" class="form-control" value="0"></td>
</tr></tbody></table>
<button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="addLine()">Add line</button>
<div class="row g-3">
  <div class="col-md-3"><label>Discount</label><input name="discount" class="form-control" value="0"></div>
  <div class="col-md-3"><label>Tax</label><input name="tax_amount" class="form-control" value="0"></div>
  <div class="col-md-3"><label>Transport</label><input name="transport_charges" class="form-control" value="0"></div>
</div>
<div class="mt-3"><label>Notes</label><textarea name="notes" class="form-control" rows=2></textarea></div>
<button class="btn btn-success mt-3">Save Purchase</button>
</div></form>
<script>
function addLine(){const tb=document.querySelector('#lines tbody');const r=tb.rows[0].cloneNode(true);tb.appendChild(r);}
</script>
{% endblock %}
