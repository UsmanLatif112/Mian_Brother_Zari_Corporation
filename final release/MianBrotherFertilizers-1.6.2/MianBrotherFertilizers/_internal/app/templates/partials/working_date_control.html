{% if can_manage_working_date %}
<div class="working-date-dropdown" id="working-date-control">
  <button type="button"
          class="btn btn-sm working-date-toggle{% if is_custom_working_date %} is-custom{% endif %}"
          id="working-date-toggle"
          aria-expanded="false"
          aria-controls="working-date-menu"
          title="Set default date for new entries">
    <i class="fa-solid fa-calendar-day"></i>
    <span class="working-date-toggle-label" id="working-date-toggle-label">{{ working_date_display }}</span>
    {% if is_custom_working_date %}
    <span class="working-date-dot" aria-hidden="true"></span>
    {% endif %}
  </button>
  <div class="working-date-menu" id="working-date-menu" hidden>
    <div class="working-date-panel">
      <div class="working-date-panel-head">
        <strong>Working date</strong>
        <p class="small text-muted mb-0">Default for sales, payments, expenses &amp; other new entries.</p>
      </div>
      <label class="form-label small mb-1" for="working-date-input">Select date</label>
      <input type="date"
             id="working-date-input"
             class="form-control form-control-sm"
             value="{{ working_date }}"
             aria-label="Working date">
      <div class="working-date-actions">
        <button type="button" class="btn btn-sm btn-primary" id="working-date-apply">
          <i class="fa-solid fa-check me-1" aria-hidden="true"></i>Apply
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="working-date-reset">
          <i class="fa-solid fa-rotate-left me-1" aria-hidden="true"></i>Today
        </button>
      </div>
    </div>
  </div>
</div>
{% elif is_custom_working_date %}
<div class="working-date-badge" title="Admin set working date for new entries">
  <i class="fa-solid fa-calendar-day"></i>
  <span>{{ working_date_display }}</span>
</div>
{% endif %}
