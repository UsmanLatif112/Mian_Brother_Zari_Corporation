<div class="modal fade erp-confirm-modal" id="offlineModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <div class="erp-confirm-icon erp-confirm-icon--warning">
          <i class="fa-solid fa-wifi-slash"></i>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body pt-2">
        <h5 class="modal-title mb-1">No Internet Connection</h5>
        <p class="text-muted small mb-0" id="offline-modal-message">
          Connect to the internet to sign in with Google Drive. You can keep using the app offline —
          sales, inventory, and local backups still work.
        </p>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">OK, continue offline</button>
      </div>
    </div>
  </div>
</div>
